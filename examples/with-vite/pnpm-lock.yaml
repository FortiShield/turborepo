lockfileVersion: '6.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      eslint:
        specifier: ^9.28.0
        version: 9.28.0
      prettier:
        specifier: ^3.2.5
        version: 3.2.5
      turbo:
        specifier: ^2.0.3
        version: 2.0.3

  apps/docs:
    dependencies:
      '@repo/ui':
        specifier: workspace:*
        version: link:../../packages/ui
    devDependencies:
      '@repo/eslint-config':
        specifier: workspace:*
        version: link:../../packages/config-eslint
      '@repo/typescript-config':
        specifier: workspace:*
        version: link:../../packages/config-typescript
      eslint:
        specifier: ^9.28.0
        version: 9.28.0
      typescript:
        specifier: ^5.3.3
        version: 5.3.3
      vite:
        specifier: ^7.3.1
        version: 7.3.1

  apps/web:
    dependencies:
      '@repo/ui':
        specifier: workspace:*
        version: link:../../packages/ui
    devDependencies:
      '@repo/eslint-config':
        specifier: workspace:*
        version: link:../../packages/config-eslint
      '@repo/typescript-config':
        specifier: workspace:*
        version: link:../../packages/config-typescript
      eslint:
        specifier: ^9.28.0
        version: 9.28.0
      typescript:
        specifier: ^5.3.3
        version: 5.3.3
      vite:
        specifier: ^7.3.1
        version: 7.3.1

  packages/config-eslint:
    dependencies:
      '@typescript-eslint/eslint-plugin':
        specifier: ^7.1.0
        version: 7.1.0(@typescript-eslint/parser@7.1.0)(eslint@8.57.1)(typescript@5.9.3)
      '@typescript-eslint/parser':
        specifier: ^7.1.0
        version: 7.1.0(eslint@8.57.1)(typescript@5.9.3)
      eslint-config-prettier:
        specifier: ^9.1.0
        version: 9.1.0(eslint@8.57.1)

  packages/config-typescript: {}

  packages/ui:
    devDependencies:
      '@repo/eslint-config':
        specifier: workspace:*
        version: link:../config-eslint
      '@repo/typescript-config':
        specifier: workspace:*
        version: link:../config-typescript
      eslint:
        specifier: ^9.28.0
        version: 9.28.0
      typescript:
        specifier: ^5.3.3
        version: 5.3.3

